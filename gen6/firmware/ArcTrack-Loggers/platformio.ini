; ArcTrack Logger — records GPS position data to local storage
[platformio]
name = ArcTrack-Loggers

[env:arctrack_logger]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; GPS, Power, Storage, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_LOGGER
