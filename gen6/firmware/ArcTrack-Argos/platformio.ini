; ArcTrack Argos Tracker — GPS position via Argos satellite network
[platformio]
name = ArcTrack-Argos

[env:arctrack_argos]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; GPS, Power, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_ARGOS
