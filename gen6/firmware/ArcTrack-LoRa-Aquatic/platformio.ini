; ArcTrack LoRa Aquatic Tracker — GPS position via LoRa for marine/aquatic use
[platformio]
name = ArcTrack-LoRa-Aquatic

[env:arctrack_lora_aqua]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; GPS, LoRa, Power, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_LORA_AQUATIC
