; ArcTrack Yagi — directional LoRa antenna for bearing/tracking
[platformio]
name = ArcTrack-Yagi

[env:arctrack_yagi]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; LoRa, BLE, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_YAGI
