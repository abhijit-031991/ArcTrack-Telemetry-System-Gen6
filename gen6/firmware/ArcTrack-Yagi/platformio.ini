; ArcTrack Yagi — directional LoRa + BLE receiver
;
; Environments:
;   xiao_nrf52840           XIAO nRF52840 + Wio-SX1262  (NimBLE  — default)
;   xiao_nrf52840_bluefruit XIAO nRF52840 + Wio-SX1262  (Bluefruit — legacy/fallback)
;   xiao_esp32s3            XIAO ESP32S3  + Wio-SX1262  (NimBLE)

[platformio]
name         = ArcTrack-Yagi
default_envs = xiao_nrf52840

; ── Shared base ───────────────────────────────────────────────────────────────
[env:xiao_nrf52840]
platform       = nordicnrf52
board          = seeed_xiao_nrf52840
framework      = arduino
lib_extra_dirs = ../_common
lib_deps =
    bblanchon/ArduinoJson
    jgromes/RadioLib
    h2zero/NimBLE-Arduino
monitor_speed  = 115200
upload_speed   = 921600
build_flags =
    -DARCTRACK_YAGI
    -DARDUINOJSON_USE_LONG_LONG=1
    -DTARGET_NRF_NIMBLE

[env:xiao_nrf52840_bluefruit]
platform       = nordicnrf52
board          = seeed_xiao_nrf52840
framework      = arduino
lib_extra_dirs = ../_common
lib_deps =
    bblanchon/ArduinoJson
    jgromes/RadioLib
monitor_speed  = 115200
upload_speed   = 921600
build_flags =
    -DARCTRACK_YAGI
    -DARDUINOJSON_USE_LONG_LONG=1
    -DTARGET_NRF_BLUEFRUIT

[env:xiao_esp32s3]
platform       = espressif32
board          = seeed_xiao_esp32s3
framework      = arduino
lib_extra_dirs = ../_common
lib_deps =
    bblanchon/ArduinoJson
    jgromes/RadioLib
    h2zero/NimBLE-Arduino
monitor_speed  = 115200
upload_speed   = 921600
build_flags =
    -DARCTRACK_YAGI
    -DARDUINOJSON_USE_LONG_LONG=1
    -DTARGET_ESP32S3
