; ArcTrack Base Station — receives LoRa packets and logs them to storage
[platformio]
name = ArcTrack-BaseStations

[env:arctrack_base]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; LoRa, Storage, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_BASE_STATION
