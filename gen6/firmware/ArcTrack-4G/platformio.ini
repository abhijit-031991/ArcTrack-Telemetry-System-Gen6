; ArcTrack 4G Tracker — GPS position transmitted over 4G LTE cellular
[platformio]
name = ArcTrack-4G

[env:arctrack_4g]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; GPS, Power, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_4G
