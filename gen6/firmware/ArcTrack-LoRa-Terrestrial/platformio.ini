; ArcTrack LoRa Terrestrial Tracker — GPS position via LoRa for land use
[platformio]
name = ArcTrack-LoRa-Terrestrial

[env:arctrack_lora_land]
platform  = espressif32
board     = esp32dev        ; replace with your target board
framework = arduino

lib_extra_dirs = ../_common  ; GPS, LoRa, Power, Comms available

monitor_speed   = 115200
upload_speed    = 921600
build_flags     = -DARCTRACK_LORA_TERRESTRIAL
